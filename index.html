<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tom's Restaurant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Restaurant Main Picture -->
    <section class="hero">
        <img src="tom's-restuarant.jpg.jpeg"
             alt="Tom's Restaurant">

        <div class="hero-text">
            <h1>Tom's Restaurant</h1>
            <p>Delicious food, made with love.</p>
        </div>
    </section>


    <!-- Menu -->
    <section class="menu">

        <h2>Our Menu</h2>

        <div class="food-container">

            <!-- Chicken Biryani -->
            <div class="food-card">
                <img src="chicken-biryani.jpg.jpeg"
                     alt="Chicken Biryani">

                <h3>Chicken Biryani</h3>
                <p class="price">₹200</p>
            </div>


            <!-- Chicken Fry Piece Biryani -->
            <div class="food-card">
                <img src="chicken-fry-piece-biryani.jpg.jpeg"
                     alt="Chicken Fry Piece Biryani">

                <h3>Chicken Fry Piece Biryani</h3>
                <p class="price">₹210</p>
            </div>


            <!-- Chicken Joint Biryani -->
            <div class="food-card">
                <img src="chicken-joint-biryani.jpg.jpeg"
                     alt="Chicken Joint Biryani">

                <h3>Chicken Joint Biryani</h3>
                <p class="price">₹220</p>
            </div>

        </div>

    </section>


    <!-- About -->
    <section class="about">

        <h2>About Tom's Restaurant</h2>

        <p>
            Welcome to Tom's Restaurant!
            Enjoy delicious food, great taste and a wonderful experience.
        </p>

    </section>


    <!-- Footer -->
    <footer>

        <p>© 2026 Tom's Restaurant</p>

    </footer>

</body>

</html>
